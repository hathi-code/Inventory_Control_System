<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Inventory</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
  <style>
    /* Small extra styles just for this page, kept separate since
       it's the only page that needs a centered card layout. */
    .login-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
    }
    .login-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 36px 32px;
      width: 340px;
    }
    .login-card h1 {
      font-family: var(--font-display);
      font-size: 20px;
      margin-bottom: 4px;
    }
    .login-card p { color: var(--text-muted); font-size: 13px; margin-bottom: 24px; }
    .field { margin-bottom: 14px; }
    .field label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 6px; }
    .field input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      font-family: var(--font-body);
      outline: none;
    }
    .field input:focus { border-color: var(--blue); }
    .login-btn {
      width: 100%;
      background: var(--blue);
      color: #fff;
      border: none;
      padding: 11px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 6px;
    }
    .login-error {
      color: var(--red);
      font-size: 13px;
      margin-top: 12px;
      display: none;
    }
  </style>
</head>
<body>

  <div class="login-wrap">
    <div class="login-card">
      <h1>Welcome back</h1>
      <p>Sign in to your inventory dashboard</p>

      <form id="login-form">
        <div class="field">
          <label for="username">Username</label>
          <input type="text" id="username" required />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" required />
        </div>
        <button type="submit" class="login-btn">Sign In</button>
        <p class="login-error" id="login-error">Invalid username or password.</p>
      </form>
    </div>
  </div>

  <script src="login.js" defer></script>
</body>
</html>
